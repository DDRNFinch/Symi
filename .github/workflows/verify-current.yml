name: Verify Symi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check current JavaScript
        run: |
          node --check app.js
          node --check naxos-controller.js
          node --check symi-brand-v017.js
          node --check symi-otj-share-v017.js
          node --check symi-course-hub-v018.js
          node --check symi-week-calendar-v023.js
          node --check symi-standard-ui-v024.js
          node --check symi-home-polish-v025.js
          node --check symi-updater-v027.js
          node --check service-worker.js
      - name: Run Symi regression checks
        run: node --test tests/*.test.mjs
      - name: Validate manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); JSON.parse(require('fs').readFileSync('update.json','utf8'));"